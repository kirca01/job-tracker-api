services:
  db:
    image: postgres:16
    container_name: jobtracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    container_name: jobtracker-api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=jobtracker;Username=postgres;Password=postgres
      - Jwt__Secret=kircakircakircakircakircakirca12
    depends_on:
      - db
volumes:
  pgdata:
